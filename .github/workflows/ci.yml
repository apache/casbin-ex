name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Keep the whole job in :test so dev-only deps (ex_doc -> earmark_parser,
      # git_hooks) are never compiled. earmark_parser needs leex, and the
      # distro's erlang-nox package ships parsetools without its include/ dir.
      MIX_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Erlang and Elixir
        run: |
          sudo apt-get update -q
          sudo apt-get install -y erlang-nox elixir
          mix local.hex --force
          mix local.rebar --force

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Check code formatting
        run: mix format --check-formatted
      
      - name: Compile dependencies
        run: mix deps.compile
      
      - name: Compile application
        run: mix compile --warnings-as-errors
      
      - name: Run tests
        run: mix test
