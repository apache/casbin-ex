name: Prepare release candidate

on:
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'apache/casbin-ex'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare unsigned source archive
        run: python3 scripts/prepare_source.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/candidate"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 14
